<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
 <link rel="stylesheet" href="css/contact.css">
</head>
<script src="js/form-validation.js" defer></script>
<body>
  <header>
    <nav aria-label="Main navigation">
      <!-- paste the shared nav from index.html here -->
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p>Send us an enquiry and we will reply as soon as we can.</p>

    <form id="contactForm" novalidate>
      <div>
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
        <span class="error" id="nameError" aria-live="polite"></span>
      </div>

      <div>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <span class="error" id="emailError" aria-live="polite"></span>
      </div>

      <div>
        <label for="subject">Enquiry type</label>
        <select id="subject" name="subject" required>
          <option value="">Select one</option>
          <option value="general">General enquiry</option>
          <option value="services">Services</option>
          <option value="events">Events</option>
        </select>
        <span class="error" id="subjectError" aria-live="polite"></span>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required minlength="10"></textarea>
        <span class="error" id="messageError" aria-live="polite"></span>
      </div>

      <button type="submit">Send enquiry</button>
    </form>

    <div id="formSuccess" role="status" hidden></div>
  </main>

  <footer>
    <!-- paste the shared footer here -->
  </footer>

  <script src="js/form-validation.js" defer></script>
</body>
</html>
